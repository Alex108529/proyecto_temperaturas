<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Convertidor de Temperatura</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <div class="contenedor">

        <h1>🌡️ Convertidor de Temperatura</h1>

        <p>Convierte entre Celsius y Fahrenheit</p>

        <label>Temperatura:</label>

        <input
            type="text"
            id="temperatura"
            placeholder="Ejemplo: 25"
        >

        <small id="mensajeError"></small>


        <label>Convertir desde:</label>

        <select id="unidad">

            <option value="celsius">Celsius (°C)</option>

            <option value="fahrenheit">Fahrenheit (°F)</option>

        </select>


        <label>Convertir hacia:</label>

        <select id="unidadDestino">

            <option value="fahrenheit">Fahrenheit (°F)</option>

            <option value="celsius">Celsius (°C)</option>

        </select>


        <button onclick="convertir()">
            Convertir
        </button>


        <div class="resultado">

            <h3>Resultado</h3>

            <p id="resultado">--</p>

        </div>

    </div>


    <script src="javascrip.js"></script>

</body>

</html>
